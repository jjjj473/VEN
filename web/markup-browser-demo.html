<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markup Browser Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 1000px; }
      textarea { width: 100%; min-height: 220px; font-family: monospace; }
      pre { background: #111; color: #d7ffd7; padding: 1rem; overflow: auto; }
      #rendered { border: 1px solid #ddd; padding: 1rem; border-radius: 8px; }
      .error { color: #9b1c1c; font-weight: 600; }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/OWNER/REPO@REF/scripts/markup.js"></script>
  </head>
  <body>
    <h1>Markup (Complex Engine + Error Logs)</h1>
    <p>
      The library is loaded directly from GitHub through jsDelivr. It parses
      content, renders HTML, and returns structured error logs with fix advice.
    </p>

    <textarea id="input"># Demo
## Good Heading
#### Bad Heading Jump

- [x] complete task
- [ ] open task

Broken **bold marker
Bad link [docs](https://example.com

```js
const x = 1;
</textarea>

    <button id="run">Parse + Render + Validate</button>

    <h2>Diagnostics</h2>
    <pre id="diag"></pre>

    <h2>Error Log</h2>
    <pre id="errors"></pre>

    <h2>Rendered Output</h2>
    <div id="rendered"></div>

    <script>
      const inputEl = document.getElementById('input');
      const diagEl = document.getElementById('diag');
      const errorsEl = document.getElementById('errors');
      const renderedEl = document.getElementById('rendered');

      document.getElementById('run').addEventListener('click', () => {
        try {
          const doc = Markup.parseMarkup(inputEl.value);
          diagEl.textContent = Markup.diagnostics(doc);
          errorsEl.textContent = Markup.formatErrors(doc.errors);
          renderedEl.innerHTML = Markup.renderMarkupHtml(doc);

          if (doc.errors.some((e) => e.severity === 'error')) {
            errorsEl.classList.add('error');
          } else {
            errorsEl.classList.remove('error');
          }
        } catch (err) {
          errorsEl.classList.add('error');
          errorsEl.textContent = err.message;
        }
      });
    </script>
  </body>
</html>
